name: Scheduled Teams Message

on:
  schedule:
    - cron: '0 11 * * 1-5'    # 12:00 UK (BST) — daily
    - cron: '30 15 * * 1-5'   # 16:30 UK (BST) — daily
    - cron: '0 16 * * 5'      # 17:00 UK (BST) — Friday weekly wrap-up
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine period and title
        id: vars
        run: |
          if [ "${{ github.event.schedule }}" == "0 16 * * 5" ]; then
            echo "period=thisWeek" >> $GITHUB_OUTPUT
            echo "title=SIPs Leaderboard — Weekly Wrap-Up" >> $GITHUB_OUTPUT
          else
            echo "period=today" >> $GITHUB_OUTPUT
            echo "title=SIPs Leaderboard — Update" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Take leaderboard screenshot
        env:
          SCREENSHOT_PERIOD: ${{ steps.vars.outputs.period }}
        run: node screenshot.js

      - name: Commit and push screenshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add leaderboard.png
          git commit -m "Update leaderboard screenshot" || echo "No changes"
          git push

      - name: Post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CARD_TITLE: ${{ steps.vars.outputs.title }}
        run: bash send-message.sh
