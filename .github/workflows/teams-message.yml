name: Scheduled Teams Message Hansbury SIPs

on:
  schedule:
    - cron: '0 11 * * 1-5'    # 12:00 UK time (BST)
    - cron: '30 15 * * 1-5'   # 16:30 UK time (BST)
  workflow_dispatch:  # allows manual trigger for testing

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: bash send-message.sh
