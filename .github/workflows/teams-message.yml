name: Scheduled Teams Message

on:
  schedule:
    - cron: '0 11 * * 1-5'
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Take leaderboard screenshot
        run: node screenshot.js

      - name: Commit and push screenshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add leaderboard.png
          git commit -m "Update leaderboard screenshot" || echo "No changes"
          git push

      - name: Post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: bash send-message.sh
